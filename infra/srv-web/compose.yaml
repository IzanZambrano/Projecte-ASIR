# srv-web: Nginx (HTTPS + web estática) -> API FastAPI
# Arranque:  cd infra/srv-web && docker compose up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: alpha-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../../frontend:/usr/share/nginx/html:ro

  api:
    build: ../../backend
    container_name: alpha-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Nginx la publica en /api/ (para que /api/docs funcione)
      API_ROOT_PATH: /api
    # Sin "ports": solo es accesible a través de Nginx
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Traductor propio (LibreTranslate): traduce título y resumen al español y al
  # catalán. Solo lo usa la API; no se publica hacia fuera.
  # La primera vez descarga los modelos de idioma (unos minutos); se guardan en
  # el volumen lt_modelos. Necesita ~2 GB de RAM.
  traductor:
    image: libretranslate/libretranslate:v1.6.5
    container_name: alpha-traductor
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,es,ca
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "2"
    expose:
      - "5000"
    volumes:
      - lt_modelos:/home/libretranslate/.local

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command: --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

volumes:
  lt_modelos:
