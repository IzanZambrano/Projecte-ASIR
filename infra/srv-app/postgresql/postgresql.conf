# Configuración de PostgreSQL para srv-app.
# Solo se listan los valores que cambian respecto a los de fábrica.

listen_addresses = '*'          # Solo escucha en la red interna de Docker; filtra pg_hba.conf
port = 5432
max_connections = 50

hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# Memoria (ajustar a la RAM de la máquina). srv-app comparte la RAM con la API y
# el traductor (~2 GB), así que PostgreSQL se queda con poco: valores para ~4 GB
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB

# Registro: conexiones y consultas lentas, para auditoría y depuración
logging_collector = off         # Los logs van a la salida del contenedor
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d %h '

timezone = 'Europe/Madrid'
log_timezone = 'Europe/Madrid'
