# Configuración de PostgreSQL para srv-db.
# Solo se listan los valores que cambian respecto a los de fábrica.

listen_addresses = '*'          # El filtrado lo hacen ufw y pg_hba.conf
port = 5432
max_connections = 50

hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# Memoria (ajustar a la RAM de la máquina; valores para ~2 GB)
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB

# Registro: conexiones y consultas lentas, para auditoría y depuración
logging_collector = off         # Los logs van a la salida del contenedor
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d %h '

timezone = 'Europe/Madrid'
log_timezone = 'Europe/Madrid'
